<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#070709">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IRON TRACK">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>IRON TRACK — Musculation & Surcharge progressive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="app">

    <header class="app-header">
        <div>
            <div class="brand">IRON<em>TRACK</em></div>
            <div class="header-sub">Surcharge progressive automatique</div>
        </div>
        <button class="icon-btn" onclick="openEditor()" title="Nouvelle séance">＋</button>
    </header>

    <main>
        <section id="view-home" class="view active"><div id="homeContent"></div></section>
        <section id="view-sessions" class="view"><div id="sessionsContent"></div></section>
        <section id="view-workout" class="view"><div id="workoutContent"></div></section>
        <section id="view-history" class="view"><div id="historyContent"></div></section>
        <section id="view-stats" class="view"><div id="statsContent"></div></section>
        <section id="view-profile" class="view"><div id="profileContent"></div></section>
    </main>

    <!-- Minuteur de repos flottant -->
    <div class="rest-timer" id="restTimer">
        <div class="timer-ring">
            <svg width="52" height="52" viewBox="0 0 52 52">
                <defs>
                    <linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ff5c1f"/>
                        <stop offset="100%" stop-color="#ffb340"/>
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="26" cy="26" r="22" fill="none" stroke-width="4"/>
                <circle class="ring-fg" id="restRing" cx="26" cy="26" r="22" fill="none" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <div class="timer-val" id="restVal">0:00</div>
        </div>
        <div>
            <div class="timer-label">Repos</div>
            <div class="rest-timer-actions" style="margin-top:5px;">
                <button class="btn small secondary" onclick="addRest(30)">+30s</button>
                <button class="btn small ghost" onclick="stopRest()">Passer</button>
            </div>
        </div>
    </div>

    <!-- Barre de navigation -->
    <nav class="tabbar">
        <button class="tab active" data-tab="home" onclick="navigateTo('home')"><span class="tab-icon">🏠</span>Accueil</button>
        <button class="tab" data-tab="sessions" onclick="navigateTo('sessions')"><span class="tab-icon">📋</span>Séances</button>
        <button class="tab" data-tab="workout" onclick="navigateTo('workout')"><span class="tab-icon">⚡</span>Entraîner</button>
        <button class="tab" data-tab="history" onclick="navigateTo('history')"><span class="tab-icon">🕐</span>Historique</button>
        <button class="tab" data-tab="stats" onclick="navigateTo('stats')"><span class="tab-icon">📈</span>Stats</button>
        <button class="tab" data-tab="profile" onclick="navigateTo('profile')"><span class="tab-icon">👤</span>Profil</button>
    </nav>

    <!-- Bottom sheets -->
    <div class="sheet-backdrop" id="sheetBackdrop"></div>

    <div class="sheet" id="editorSheet">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
            <div class="sheet-title" id="editorSheetTitle">Nouvelle séance</div>
            <button class="icon-btn" onclick="closeSheets()">✕</button>
        </div>
        <div class="sheet-body" id="editorSheetBody"></div>
    </div>

    <div class="sheet" id="pickerSheet">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
            <div class="sheet-title">Choisir des exercices</div>
            <button class="icon-btn" onclick="confirmPick()">✕</button>
        </div>
        <div class="sheet-body" id="pickerSheetBody"></div>
    </div>

    <div class="sheet" id="programSheet">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
            <div class="sheet-title" id="programSheetTitle">Programme</div>
            <button class="icon-btn" onclick="closeSheets()">✕</button>
        </div>
        <div class="sheet-body" id="programSheetBody"></div>
    </div>

    <div class="sheet" id="summarySheet">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
            <div class="sheet-title">Bilan</div>
            <button class="icon-btn" onclick="closeSheets(); navigateTo('home')">✕</button>
        </div>
        <div class="sheet-body" id="summarySheetBody"></div>
    </div>

    <div class="sheet" id="measureSheet">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
            <div class="sheet-title">📏 Nouvelle mesure</div>
            <button class="icon-btn" onclick="closeSheets()">✕</button>
        </div>
        <div class="sheet-body" id="measureSheetBody"></div>
    </div>

    <div class="sheet" id="videoSheet">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
            <div class="sheet-title" id="videoSheetTitle">Exercice</div>
            <button class="icon-btn" onclick="closeSheets(); document.getElementById('videoSheetBody').innerHTML=''">✕</button>
        </div>
        <div class="sheet-body" id="videoSheetBody"></div>
    </div>

    <!-- Toast & confettis -->
    <div class="toast" id="toast"></div>
    <canvas id="confettiCanvas"></canvas>

</div>
<script src="app.js"></script>
</body>
</html>
